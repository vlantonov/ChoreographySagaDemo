{{- if .Values.order.enabled -}}
{{- $c := .Values.order -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-order-db
  labels:
    app.kubernetes.io/name: order
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: choreography-saga
type: Opaque
stringData:
  url: {{ $c.database.url | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-order
  labels:
    app.kubernetes.io/name: order
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: choreography-saga
spec:
  replicas: {{ $c.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: order
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: order
          image: {{ include "cs.image" (dict "root" $ "image" $c.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ $c.service.grpcPort }}
            - name: http
              containerPort: {{ $c.service.httpPort }}
          env:
            - name: ORDER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $c.database.urlSecretName | default (printf "%s-order-db" .Release.Name) }}
                  key: {{ $c.database.urlSecretKey }}
            - name: KAFKA_BROKERS
              value: {{ .Values.global.kafkaBrokers | quote }}
            - name: KAFKA_CONSUMER_GROUP
              value: {{ $c.consumerGroup | quote }}
            - name: ORDER_GRPC_ADDR
              value: ":{{ $c.service.grpcPort }}"
            - name: ORDER_HTTP_ADDR
              value: ":{{ $c.service.httpPort }}"
            - name: OTEL_SERVICE_NAME
              value: order
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.global.otlpEndpointNoScheme | quote }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{ toYaml $c.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-order
  labels:
    app.kubernetes.io/name: order
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: choreography-saga
spec:
  selector:
    app.kubernetes.io/name: order
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: grpc
      port: {{ $c.service.grpcPort }}
      targetPort: grpc
    - name: http
      port: {{ $c.service.httpPort }}
      targetPort: http
{{- end }}
