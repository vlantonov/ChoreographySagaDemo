# CI for the Choreography Saga demo (Release Engineer, tech-stack §13).
#
# Stages: per-language build+test -> Docker image builds (multi-stage) ->
# packaging/config validation (compose config, helm lint/template, k8s dry-run,
# promtool, otelcol validate). Kept free-tier friendly (no paid runners).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Order service (Go): build, vet, test.
  # ---------------------------------------------------------------------------
  order:
    name: order (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/order
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: services/order/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1

  # ---------------------------------------------------------------------------
  # Payment service (Python): install + pytest.
  # ---------------------------------------------------------------------------
  payment:
    name: payment (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: pytest -q

  # ---------------------------------------------------------------------------
  # Inventory service (C++): core + tests without the heavy vcpkg toolchain
  # (-DINVENTORY_BUILD_SERVER=OFF uses FetchContent for json/gtest only).
  # ---------------------------------------------------------------------------
  inventory:
    name: inventory (C++ core+tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      - name: Configure (core + tests only)
        working-directory: services/inventory
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DINVENTORY_BUILD_SERVER=OFF
          -DINVENTORY_BUILD_TESTS=ON
      - name: Build
        working-directory: services/inventory
        run: cmake --build build
      - name: Test
        working-directory: services/inventory
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Build all three multi-stage Docker images (C-12, AC-12). No push.
  # ---------------------------------------------------------------------------
  images:
    name: docker images
    runs-on: ubuntu-latest
    needs: [order, payment, inventory]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build order image
        uses: docker/build-push-action@v6
        with:
          context: services/order
          file: services/order/Dockerfile
          push: false
          tags: choreography-saga/order:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build payment image
        uses: docker/build-push-action@v6
        with:
          context: services/payment
          file: services/payment/Dockerfile
          push: false
          tags: choreography-saga/payment:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build inventory image
        uses: docker/build-push-action@v6
        with:
          # Repo root context: the inventory image needs the shared proto/ module.
          context: .
          file: services/inventory/Dockerfile
          push: false
          tags: choreography-saga/inventory:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Validate packaging + observability configs without a live cluster.
  # ---------------------------------------------------------------------------
  validate-configs:
    name: validate configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose -f deploy/compose/docker-compose.yml config --quiet

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4
      - name: Helm lint
        run: helm lint deploy/helm/choreography-saga
      - name: Helm template (render smoke test)
        # Render into the workspace so the kubeconform docker action can read it
        # (docker:// actions only mount /github/workspace).
        run: helm template saga deploy/helm/choreography-saga > helm-rendered.yaml

      - name: Validate rendered Helm + raw manifests (kubeconform)
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: >-
            -strict -ignore-missing-schemas -summary
            helm-rendered.yaml deploy/k8s

      - name: Validate Prometheus rules (promtool)
        uses: docker://prom/prometheus:v2.54.1
        with:
          entrypoint: promtool
          args: check rules observability/prometheus/rules/alerts.yml

      - name: Validate OTel Collector config (otelcol validate)
        uses: docker://otel/opentelemetry-collector-contrib:0.108.0
        with:
          args: validate --config /github/workspace/observability/otel-collector/config.yaml
