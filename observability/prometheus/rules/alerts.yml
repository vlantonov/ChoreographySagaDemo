# SLO alert rules (tech-stack §9.3, FR-25, AC-7).
#
# Thresholds are taken verbatim from the tech-stack SLO table. Rules are
# expressed against the metrics the services actually emit today:
#   - saga_terminal_total{outcome="confirmed"|"cancelled"}   (Order, Go)
#   - payment_result_total{result="processed"|"failed"|"refunded"} (Payment, Py)
#   - inventory_reserve_total{result=...}                    (Inventory, C++)
#
# Latency/lag SLIs (tech-stack §9.3). Instrument -> exported Prometheus series
# (Collector `prometheus` exporter: histograms gain _bucket/_sum/_count,
# resource_to_telemetry_conversion maps service.name -> the service_name label):
#   - saga_duration_seconds                 -> saga_duration_seconds_bucket        (Order, Go)
#   - outbox_pending (observable gauge)      -> outbox_pending{service_name}        (all three)
#   - outbox_publish_lag_seconds            -> outbox_publish_lag_seconds_bucket{service_name} (all three)
#   - reserve_stock_server_duration_seconds -> reserve_stock_server_duration_seconds_bucket (Inventory, C++)
#
# The forced-failure demo (amount 66.06 / FORCE_PAYMENT_FAILURE / SKU-DEADBEEF)
# is designed to trip the compensation and payment-failure alerts (AC-7).

groups:
  - name: saga-slo
    rules:
      # Compensation rate: cancelled / all terminal sagas. Warn > 20% over 5m.
      - alert: HighCompensationRate
        expr: |
          sum(rate(saga_terminal_total{outcome="cancelled"}[5m]))
            /
          clamp_min(sum(rate(saga_terminal_total[5m])), 1e-9)
            > 0.20
        for: 5m
        labels:
          severity: warning
          slo: compensation_rate
        annotations:
          summary: "Saga compensation rate > 20% (SLO ≤ 5%)"
          description: "More than 20% of terminal sagas ended CANCELLED over the last 5m. Expected during the forced-failure demo (AC-7)."

      # Payment failure rate: failed / all payment outcomes. Warn > 20% over 5m.
      - alert: HighPaymentFailureRate
        expr: |
          sum(rate(payment_result_total{result="failed"}[5m]))
            /
          clamp_min(sum(rate(payment_result_total[5m])), 1e-9)
            > 0.20
        for: 5m
        labels:
          severity: warning
          slo: payment_failure_rate
        annotations:
          summary: "Payment failure rate > 20% (SLO ≤ 5%)"
          description: "More than 20% of payment attempts failed over the last 5m. Expected under FORCE_PAYMENT_FAILURE / magic amount 66.06 (AC-7)."

      # Saga success rate: confirmed / all terminal. Page if < 95% over 5m.
      - alert: LowSagaSuccessRate
        expr: |
          sum(rate(saga_terminal_total{outcome="confirmed"}[5m]))
            /
          clamp_min(sum(rate(saga_terminal_total[5m])), 1e-9)
            < 0.95
        for: 5m
        labels:
          severity: critical
          slo: saga_success_rate
        annotations:
          summary: "Saga success rate < 95% (SLO ≥ 99%)"
          description: "Fewer than 95% of terminal sagas reached CONFIRMED over the last 5m."

      # Inventory reservation-failure rate. Warn > 20% over 5m.
      - alert: HighInventoryReservationFailureRate
        expr: |
          sum(rate(inventory_reserve_total{result="insufficient_stock"}[5m]))
            /
          clamp_min(sum(rate(inventory_reserve_total[5m])), 1e-9)
            > 0.20
        for: 5m
        labels:
          severity: warning
          slo: inventory_failure_rate
        annotations:
          summary: "Inventory reservation-failure rate > 20%"
          description: "More than 20% of ReserveStock calls returned INSUFFICIENT_STOCK over the last 5m (e.g. SKU-DEADBEEF demo)."

      # --- Latency / lag SLOs (tech-stack §9.3) ---

      # Saga end-to-end p95 latency (create -> terminal). SLO p95 ≤ 2s;
      # warn if p95 > 4s over 5m. saga_duration_seconds is a Float64Histogram
      # emitted by Order; the exporter suffixes buckets with _bucket.
      - alert: HighSagaLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(saga_duration_seconds_bucket[5m]))
          ) > 4
        for: 5m
        labels:
          severity: warning
          slo: saga_latency
        annotations:
          summary: "Saga end-to-end p95 latency > 4s (SLO ≤ 2s)"
          description: "95th-percentile create→terminal saga latency exceeded 4s over the last 5m."

      # Outbox publish lag: age of a row when the relay publishes it. SLO p95 ≤ 1s;
      # warn if p95 > 10s over 5m. Emitted by all three services; labeled per
      # service via the service_name label (from service.name).
      - alert: HighOutboxPublishLagP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service_name) (rate(outbox_publish_lag_seconds_bucket[5m]))
          ) > 10
        for: 5m
        labels:
          severity: warning
          slo: outbox_publish_lag
        annotations:
          summary: "Outbox publish lag p95 > 10s on {{ $labels.service_name }} (SLO ≤ 1s)"
          description: "95th-percentile outbox row age at publish time exceeded 10s over the last 5m for {{ $labels.service_name }}; the relay is falling behind."

      # Outbox backlog depth. Warn if > 100 pending rows over 5m, per service.
      # outbox_pending is an observable gauge (single replica -> max collapses
      # any transient duplicate series to one value per service).
      - alert: HighOutboxBacklog
        expr: max by (service_name) (outbox_pending) > 100
        for: 5m
        labels:
          severity: warning
          slo: outbox_backlog
        annotations:
          summary: "Outbox backlog > 100 pending on {{ $labels.service_name }}"
          description: "More than 100 unpublished outbox rows on {{ $labels.service_name }} over the last 5m."

      # ReserveStock sync gRPC handler p95 latency (Inventory). SLO p95 ≤ 250ms;
      # warn if p95 > 750ms over 5m.
      - alert: HighReserveStockLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(reserve_stock_server_duration_seconds_bucket[5m]))
          ) > 0.75
        for: 5m
        labels:
          severity: warning
          slo: reserve_stock_latency
        annotations:
          summary: "ReserveStock p95 latency > 750ms (SLO ≤ 250ms)"
          description: "95th-percentile ReserveStock gRPC handler latency exceeded 750ms over the last 5m."

  - name: pipeline-health
    rules:
      # The metrics pipeline is down if Prometheus cannot scrape the Collector.
      - alert: OtelCollectorScrapeDown
        expr: up{job="otel-collector-metrics"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "OTel Collector metrics endpoint is down"
          description: "Prometheus cannot scrape otel-collector:8889; service metrics/SLOs are blind."
