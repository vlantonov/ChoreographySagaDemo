[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payment-service"
version = "0.1.0"
description = "Choreography Saga demo — Payment service (Python)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "confluent-kafka>=2.5,<3",
    "grpcio>=1.64,<2",
    "protobuf>=4.25,<6",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
    "opentelemetry-api>=1.27,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "grpcio-tools>=1.64,<2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
payment-service = "payment.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/payment"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
